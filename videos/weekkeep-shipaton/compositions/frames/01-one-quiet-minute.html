  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const FRAME_ID = "01-one-quiet-minute";
      const VIEWPORT_WIDTH = 1920;
      const VIEWPORT_HEIGHT = 1080;
      const root = document.getElementById("root");
      const world = document.getElementById("f01-one-quiet-minute-world");
      const target = document.getElementById("f01-one-quiet-minute-fixture-target");
      const albumImage = document.getElementById("f01-one-quiet-minute-album-image");
      const microNote = document.getElementById("f01-one-quiet-minute-micro-note");
      const payoff = document.getElementById("f01-one-quiet-minute-payoff");
      const payoffRule = document.getElementById("f01-one-quiet-minute-payoff-rule");
      const stitches = world.querySelectorAll(".f01-one-quiet-minute-stitch");

      const cam = { scale: 1, x: 0, y: 0 };
      const revealScale = 12;

      function applyCamera() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }

      // Measure the real target in the neutral layout, then use T = -offset × S
      // so the opening crop is centered without a second camera wrapper.
      world.style.transform = "translate(0px, 0px) scale(1)";
      const targetRect = target.getBoundingClientRect();
      const targetOffsetX = targetRect.left + targetRect.width / 2 - VIEWPORT_WIDTH / 2;
      const targetOffsetY = targetRect.top + targetRect.height / 2 - VIEWPORT_HEIGHT / 2;
      const initialCamera = {
        scale: revealScale,
        x: -targetOffsetX * revealScale,
        y: -targetOffsetY * revealScale,
      };

      Object.assign(cam, initialCamera);
      applyCamera();

      const dof = { value: 1.2 };
      albumImage.style.setProperty("--dof", `${dof.value}px`);

      const tl = gsap.timeline({ paused: true });
      tl.set(cam, { ...initialCamera, onUpdate: applyCamera }, 0);
      tl.fromTo(
        microNote,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" },
        1.18,
      );

      // One continuous, outward-only camera move. The frame is locked after 4.1s.
      tl.to(
        cam,
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 2.4,
          ease: "expo.out",
          onUpdate: applyCamera,
        },
        1.7,
      );
      tl.to(
        dof,
        {
          value: 0,
          duration: 2.4,
          ease: "expo.out",
          onUpdate: () => albumImage.style.setProperty("--dof", `${dof.value}px`),
        },
        1.7,
      );

      tl.fromTo(
        stitches,
        { opacity: 0, scaleY: 0.25 },
        { opacity: 1, scaleY: 1, duration: 0.42, ease: "power3.out", stagger: 0.11 },
        2.42,
      );

      const CONTENT = [
        { title: "One", body: "One", hold: 0.08 },
        { title: "One quiet minute", body: "One quiet minute", hold: 0.18 },
        { title: "One quiet minute a week.", body: "One quiet minute a week.", hold: 0.46 },
      ];
      const BASE_DURATION = 0.18;
      const SEC_PER_CHAR = 0.01;
      const TAIL_PAD = 0.21;
      let cumulative = 0;
      const sequence = CONTENT.map((entry) => {
        const duration = BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const sequenceDuration = cumulative + TAIL_PAD;

      function entryAt(time) {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].start) return sequence[index];
        }
        return sequence[0];
      }

      const driver = { t: 0 };
      let lastTitle = "";
      tl.fromTo(
        payoff,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        4.1,
      );
      tl.to(
        driver,
        {
          t: sequenceDuration,
          duration: sequenceDuration,
          ease: "none",
          onUpdate: () => {
            const entry = entryAt(driver.t);
            if (entry.title !== lastTitle) {
              payoff.textContent = entry.title;
              lastTitle = entry.title;
            }
          },
        },
        4.1,
      );
      tl.fromTo(
        payoffRule,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.36, ease: "power2.out" },
        5.42,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
