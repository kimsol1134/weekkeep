      const checkPath = root.querySelector("#wk04-check-path");

      tl.fromTo(

        2.05,

      tl.to(
        gridFocusPath,
        { strokeDashoffset: 0, duration: 1.12, ease: "power2.out" },
        2.12,

      root.querySelectorAll(".wk04-stitch").forEach((stitch, index) => {
        tl.fromTo(
          stitch,
          {
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: 0,
            scale: 0.6,
            opacity: 0,
          },
          {
            x: Number(stitch.dataset.targetX),
            y: Number(stitch.dataset.targetY),
            scale: 1,
            opacity: 1,
            duration: 1.3,
            ease: "power3.out",

          2.35 + index * 0.16,

      const limitText = root.querySelector("#wk04-limit");
      const limitStates = [

        { t: 4.68, text: "UP" },
        { t: 4.94, text: "UP TO" },
        { t: 5.28, text: "UP TO 7" },

      const limitDriver = { t: 4.15 };
      const setLimitState = (time) => {
        for (let i = limitStates.length - 1; i >= 0; i -= 1) {
          if (time >= limitStates[i].t) {
            limitText.textContent = limitStates[i].text;
            return;
          }
        }
      };
      setLimitState(4.15);

      tl.fromTo(
        limitText,
        { y: 16, scale: 0.96, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },

          duration: 1.6,
          ease: "none",
          onUpdate: () => setLimitState(limitDriver.t),
