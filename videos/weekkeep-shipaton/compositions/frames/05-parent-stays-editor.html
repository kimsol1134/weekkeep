  <script>
      (() => {
        const root = document.querySelector('[data-composition-id="05-parent-stays-editor"]');
        if (!root) return;
        const timeline = gsap.timeline({ paused: true });

        const outgoing = root.querySelector("#f05-outgoing");
        const incoming = root.querySelector("#f05-incoming");
        const stage = root.querySelector("#f05-stage");
        const target = root.querySelector("#f05-target");
        const ripple = root.querySelector("#f05-ripple");
        const cursor = root.querySelector("#f05-cursor");
        const changeOnly = root.querySelector("#f05-change-only");
        const onlyMoment = root.querySelector("#f05-only-moment");
        const connector = root.querySelector("#f05-connector");
        const restStays = root.querySelector("#f05-rest-stays");

        const TARGET_X = 1347;
        const TARGET_Y = 495;
        const CURSOR_TARGET_X = TARGET_X - 7;
        const CURSOR_TARGET_Y = TARGET_Y - 5;

        timeline.fromTo(
          stage,
          { opacity: 0, y: 18, scale: 0.985 },
          { opacity: 1, y: 0, scale: 1, duration: 0.52, ease: "power3.out" },
          0,
        );

        timeline.fromTo(
          root.querySelector("#f05-topbar"),
          { opacity: 0, y: -10 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
          0.08,
        );

        timeline.fromTo(
          root.querySelector("#f05-hero"),
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.56, ease: "power3.out" },
          0.28,
        );

        timeline.set(incoming, { opacity: 0, scale: 0.72 }, 0);
        timeline.set(target, { opacity: 0, scale: 1 }, 0);
        timeline.set(ripple, { opacity: 0, scale: 0 }, 0);
        timeline.set(changeOnly, { opacity: 0, y: 12 }, 0);
        timeline.set(onlyMoment, { opacity: 0, y: 14 }, 0);
        timeline.set(connector, { opacity: 0, scaleX: 0 }, 0);
        timeline.set(restStays, { opacity: 0, y: 14 }, 0);
        timeline.set(cursor, { x: 875, y: 572, opacity: 0, scale: 1 }, 0);

        timeline.fromTo(
          cursor,
          { x: 875, y: 572, opacity: 0, scale: 1 },
          { x: CURSOR_TARGET_X, y: CURSOR_TARGET_Y, opacity: 1, scale: 1, duration: 0.86, ease: "power2.inOut" },
          0.58,
        );

        const PRESS_AT = 2.22;
        const RELEASE_AT = 2.35;

        timeline.to(
          [cursor, target],
          { scale: 0.9, duration: 0.13, ease: "power1.in" },
          PRESS_AT,
        );
        timeline.to(
          [cursor, target],
          { scale: 1, duration: 0.52, ease: "back.out(1.8)" },
          RELEASE_AT,
        );
        timeline.to(target, { opacity: 0.92, duration: 0.06, ease: "none" }, PRESS_AT);
        timeline.to(target, { opacity: 0, duration: 0.3, ease: "power2.out" }, RELEASE_AT + 0.06);

        timeline.fromTo(
          ripple,
          { opacity: 0.72, scale: 0 },
          { opacity: 0, scale: 3.6, duration: 0.72, ease: "power2.out" },
          PRESS_AT + 0.08,
        );

        timeline.to(
          outgoing,
          { scale: 0.72, opacity: 0, duration: 0.42, ease: "power2.in" },
          3.5,
        );
        timeline.fromTo(
          incoming,
          { scale: 0.72, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.62, ease: "back.out(1.8)" },
          3.78,
        );

        timeline.fromTo(
          changeOnly,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
          3.72,
        );

        const words = root.querySelectorAll(".f05-word");
        const driver = { t: 0 };
        const ATTACK_DUR = 0.12;
        const RELEASE_DUR = 0.34;
        const REST_LEVEL = 0.14;
        const MAX_SCALE_BOOST = 0.14;
        const TIMINGS = {
          change: { start: 0.1, end: 0.52 },
          only: { start: 0.68, end: 1.18 },
        };

        const envelope = (time, start, end) => {
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
          const releaseEnd = end + RELEASE_DUR;
          if (time < releaseEnd) {
            return 1 - ((time - end) / RELEASE_DUR) * (1 - REST_LEVEL);
          }
          return REST_LEVEL;
        };

        const lerpChannel = (from, to, amount) => Math.round(from + (to - from) * amount);
        const colorAt = (amount) => {
          const rest = { r: 91, g: 65, b: 94 };
          const active = { r: 37, g: 33, b: 43 };
          return `rgb(${lerpChannel(rest.r, active.r, amount)}, ${lerpChannel(rest.g, active.g, amount)}, ${lerpChannel(rest.b, active.b, amount)})`;
        };

        timeline.to(
          driver,
          {
            t: 1.7,
            duration: 1.7,
            ease: "none",
            onUpdate: () => {
              words.forEach((word) => {
                const timing = TIMINGS[word.dataset.word];
                if (!timing) return;
                const amount = envelope(driver.t, timing.start, timing.end);
                word.style.color = colorAt(amount);
                word.style.transform = `scale(${1 + MAX_SCALE_BOOST * amount})`;
              });
            },
          },
          3.72,
        );

        timeline.to(
          cursor,
          { x: 1448, y: 568, duration: 0.35, ease: "power2.out" },
          5.18,
        );

        timeline.fromTo(
          onlyMoment,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          5.4,
        );
        timeline.fromTo(
          connector,
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.46, ease: "power2.out" },
          5.48,
        );
        timeline.fromTo(
          restStays,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          5.78,
        );

        const finalHold = { value: 0 };
        timeline.to(finalHold, { value: 1, duration: 0.82, ease: "none" }, 6.18);

        window.__timelines = window.__timelines || {};
        window.__timelines["05-parent-stays-editor"] = timeline;
      })();
  </script>
