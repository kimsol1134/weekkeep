  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameId = "08-quiet-by-default";
      const gsapRef = window.gsap;
      if (!gsapRef) return;

      const timeline = gsapRef.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="08-quiet-by-default"]');
      const headlineLines = root.querySelectorAll(".f08-quiet-headline-line");
      const settingsCard = root.querySelector(".f08-quiet-media-settings");
      const privacyCard = root.querySelector(".f08-quiet-media-privacy");
      const settingsFocus = root.querySelector(".f08-quiet-reminder-focus");
      const grid = root.querySelector(".f08-quiet-evidence-grid");
      const topbar = root.querySelector(".f08-quiet-topbar");
      const stitchRail = root.querySelector(".f08-quiet-stitch-rail");
      const photosCallout = root.querySelector(".f08-quiet-callout-photos");
      const reminderCallout = root.querySelector(".f08-quiet-callout-reminder");
      const focusCaption = root.querySelector(".f08-quiet-focus-caption");
      const privacyLabel = root.querySelector(".f08-quiet-privacy-label");
      const connector = root.querySelector(".f08-quiet-connector");
      const trustItems = root.querySelectorAll(".f08-quiet-trust-item");

      timeline.fromTo(
        topbar,
        { opacity: 0 },
        { opacity: 1, duration: 0.24, ease: "power2.out" },
        0.04,
      );

      timeline.fromTo(
        grid,
        { opacity: 0 },
        { opacity: 1, duration: 0.32, ease: "power2.out" },
        0.06,
      );

      headlineLines.forEach((line, index) => {
        timeline.fromTo(
          line,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
          0.08 + index * 0.38,
        );
      });

      timeline.fromTo(
        stitchRail,
        { opacity: 0, scaleX: 0.76 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" },
        0.72,
      );

      const burstItems = [settingsCard, privacyCard];
      const burstStartTimes = [1.3, 3.3];
      burstItems.forEach((item, index) => {
        const targetX = Number(item.dataset.targetX);
        const targetY = Number(item.dataset.targetY);
        const startProgress = 0.28;
        timeline.fromTo(
          item,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * startProgress,
            y: targetY * startProgress,
            scale: 0.94,
            opacity: 0,
          },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: 0.88,
            ease: "power3.out",
          },
          burstStartTimes[index],
        );
      });

      timeline.fromTo(
        photosCallout,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
        1.58,
      );

      timeline.fromTo(
        reminderCallout,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
        1.94,
      );

      timeline.fromTo(
        settingsFocus,
        { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: "power2.out" },
        2.28,
      );

      timeline.fromTo(
        focusCaption,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
        2.34,
      );

      timeline.fromTo(
        connector,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.56, ease: "power2.out" },
        3.42,
      );

      timeline.fromTo(
        privacyLabel,
        { opacity: 0, clipPath: "inset(0 100% 0 0)" },
        { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out" },
        3.72,
      );

      trustItems.forEach((item, index) => {
        timeline.fromTo(
          item,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
          5.24 + index * 0.38,
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = timeline;
    })();
  </script>
